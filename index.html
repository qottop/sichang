<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b6e99">
  <title>เกาะสีชัง</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app" id="app">
    <div id="offline" class="offline" hidden></div>
    <header id="top" class="top"></header>
    <main id="view" class="view"></main>
    <button id="sos" class="sos" data-act="sos" aria-label="SOS">🆘</button>
    <nav id="nav" class="nav" hidden>
      <button data-act="tab" data-to="home"><span class="ni">🏠</span><span class="nl" data-nl="tab_home"></span></button>
      <button data-act="tab" data-to="maps"><span class="ni">🗺️</span><span class="nl" data-nl="tab_maps"></span></button>
      <button data-act="tab" data-to="scan" class="scantab" aria-label="Scan QR"><span class="ni"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><rect x="8" y="8" width="3" height="3" rx=".5"/><rect x="13" y="8" width="3" height="3" rx=".5"/><rect x="8" y="13" width="3" height="3" rx=".5"/><path d="M14 14h2v2h-2z"/></svg></span><span class="nl" data-nl="tab_scan"></span></button>
      <button data-act="tab" data-to="book"><span class="ni">🎫</span><span class="nl" data-nl="tab_book"></span></button>
      <button data-act="tab" data-to="travel"><span class="ni">⛴️</span><span class="nl" data-nl="tab_travel"></span></button>
    </nav>
    <div id="toasts" class="toasts"></div>
    <div id="modal" class="modal" data-act="closeModalBg" hidden></div>
  </div>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
